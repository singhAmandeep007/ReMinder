name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/nestjs-server/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/nestjs-server/**"

defaults:
  run:
    working-directory: backend/nestjs-server

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/nestjs-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:cov
        env:
          NODE_ENV: test
          DB_TYPE: mongodb
          MONGO_DB_URI: mongodb://localhost:27017
          MONGO_DB_NAME: reminder_test

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DB_TYPE: mongodb
          MONGO_DB_URI: mongodb://localhost:27017
          MONGO_DB_NAME: reminder_test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/nestjs-server/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/nestjs-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/nestjs-server/dist
          retention-days: 7
